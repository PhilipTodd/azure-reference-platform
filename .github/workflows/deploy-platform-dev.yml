name: Deploy Platform - Dev

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-reference-platform-development
  cancel-in-progress: false

env:
  TEMPLATE_FILE: infra/bicep/main.bicep
  PARAMETER_FILE: infra/bicep/environments/dev/main.dev.bicepparam
  RESOURCE_GROUP_NAME: rg-platform-dev

jobs:
  validate-and-deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest

    # Defence in depth in addition to the GitHub Environment branch rule.
    if: github.ref == 'refs/heads/main'

    environment:
      name: development

    env:
      DEPLOYMENT_LOCATION: ${{ vars.AZURE_LOCATION }}
      SQL_ADMINISTRATOR_PASSWORD: ${{ secrets.SQL_ADMINISTRATOR_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: Show deployment context
        run: |
          az account show \
            --query "{subscription:name, subscriptionId:id, tenantId:tenantId}" \
            --output table

          echo "Git reference: $GITHUB_REF"
          echo "Template: $TEMPLATE_FILE"
          echo "Parameters: $PARAMETER_FILE"
          echo "Deployment location: $DEPLOYMENT_LOCATION"

      - name: Build and lint Bicep
        run: |
          az bicep build \
            --file "$TEMPLATE_FILE" \
            --stdout > /dev/null

          az bicep build-params \
            --file "$PARAMETER_FILE" \
            --stdout > /dev/null

      - name: Validate subscription deployment
        run: |
          az deployment sub validate \
            --name "platform-dev-validate-${{ github.run_number }}-${{ github.run_attempt }}" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETER_FILE" \
            --output none

      - name: Preview deployment
        run: |
          az deployment sub what-if \
            --name "platform-dev-whatif-${{ github.run_number }}-${{ github.run_attempt }}" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETER_FILE" \
            --result-format ResourceIdOnly

      - name: Deploy platform
        id: deploy
        run: |
          deployment_name="platform-dev-${{ github.run_number }}-${{ github.run_attempt }}"

          echo "deployment_name=$deployment_name" >> "$GITHUB_OUTPUT"

          az deployment sub create \
            --name "$deployment_name" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETER_FILE" \
            --output none

      - name: Show deployment result
        run: |
          az deployment sub show \
            --name "${{ steps.deploy.outputs.deployment_name }}" \
            --query "{
              name:name,
              state:properties.provisioningState,
              timestamp:properties.timestamp
            }" \
            --output table

      - name: Verify platform resource group
        run: |
          az group show \
            --name "$RESOURCE_GROUP_NAME" \
            --query "{
              name:name,
              location:location,
              state:properties.provisioningState
            }" \
            --output table

      - name: List deployed resources
        run: |
          az resource list \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query "[].{
              name:name,
              type:type,
              location:location
            }" \
            --output table