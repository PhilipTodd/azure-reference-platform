name: Validate Infrastructure

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'infra/bicep/**'
      - '.github/workflows/pr-validation.yml'
      - '.github/workflows/deploy-platform-dev.yml'
      - 'scripts/verify-foundations.py'

permissions:
  contents: read

concurrency:
  group: platform-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEMPLATE_FILE: infra/bicep/main.bicep

jobs:
  validate-bicep:
    name: Build and lint Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Show Bicep version
        run: az bicep version

      - name: Build and lint Bicep
        run: |
          az bicep build \
            --file "$TEMPLATE_FILE" \
            --stdout > /dev/null

      - name: Verify committed parameter file
        run: |
          test -f "infra/bicep/environments/dev/main.dev.bicepparam"

      - name: Validate main Development parameters and platform controls
        env:
          # Compilation only: no Azure login/deployment and no real SQL secret on PRs.
          SQL_ADMINISTRATOR_PASSWORD: validation-only-not-a-real-credential
        run: |
          az bicep build \
            --file "$TEMPLATE_FILE" \
            --outfile "$RUNNER_TEMP/platform-main.json"

          az bicep build-params \
            --file infra/bicep/environments/dev/main.dev.bicepparam \
            --outfile "$RUNNER_TEMP/platform-main.parameters.json"

          python3 scripts/verify-foundations.py \
            "$RUNNER_TEMP/platform-main.json" "$RUNNER_TEMP/platform-main.parameters.json"
